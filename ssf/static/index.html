<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SSF Dashboard</title><link rel="stylesheet" href="/static/style.css"></head>
<body>
<header><h1>🛡️ SSF – Security System Framework</h1>
<div><input id="key" type="password" placeholder="API key" autocomplete="off"><button id="login">Connect</button></div></header>
<main>
<section><h2>Threat Monitor</h2><div id="threats" class="cards"></div><pre id="alerts"></pre></section>
<section><h2>Scanner</h2>
<input id="path" placeholder="Path relative to scan root (default .)"><button id="scan">Run scan</button>
<pre id="scanout"></pre></section>
<section><h2>Access Control</h2><pre id="users"></pre></section>
<section><h2>Report</h2><pre id="report"></pre></section>
</main><script src="/static/app.js"></script></body></html>
